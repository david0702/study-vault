        function score(n, q) {
          const t = n.title.toLowerCase(),
            s = n.slug,
            tg = n.tags.join(" ");
          if (t.startsWith(q)) return 100;
          if (t.includes(q)) return 80;
          if (s.includes(q)) return 66;
          if (tg.includes(q)) return 54;
          if (n.plain.toLowerCase().includes(q)) return 30;
          // subsequence match on title
          let i = 0;
          for (const c of t) if (c === q[i]) i++;
          return i === q.length ? 20 : 0;
        }
        function palPaint() {
          const q = palInput.value.trim().toLowerCase();
          palResults = !q
            ? [...notes].sort(byRecent).slice(0, 8)
            : notes
                .map((n) => ({n, s: score(n, q)}))
                .filter((x) => x.s > 0)
                .sort((a, b) => b.s - a.s || byRecent(a.n, b.n))
                .slice(0, 12)
                .map((x) => x.n);
          palSel = 0;
          if (!palResults.length) {
            palList.innerHTML = `<li class="pal-none">No note matches “${MD.esc(palInput.value)}”.</li>`;
            return;
          }
          palList.innerHTML = palResults
            .map(
              (
                n,
                i,
              ) => `<li class="${i === 0 ? "sel" : ""}"><button type="button" data-i="${i}">
      <span class="pal-ico">${
        n.pdf
          ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 15h6"/></svg>'
          : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>'
      }</span>
      <span class="pal-txt"><b>${MD.esc(n.title)}</b><span>${MD.esc(n.folder || "Notes")}${n.tags.length ? " · #" + n.tags.join(" #") : ""}</span></span>
    </button></li>`,
            )
            .join("");
        }
        function palMove(d) {
          if (!palResults.length) return;
          palSel = (palSel + d + palResults.length) % palResults.length;
          [...palList.children].forEach((li, i) =>
            li.classList.toggle("sel", i === palSel),
          );
          palList.children[palSel].scrollIntoView({block: "nearest"});
        }
        function palOpen() {
          scrim.classList.add("on");
          palInput.value = "";
          palPaint();
          palInput.focus();
        }
        function palClose() {
          scrim.classList.remove("on");
          palInput.blur();
        }
        palInput.addEventListener("input", palPaint);
        palList.addEventListener("click", (e) => {
          const b = e.target.closest("button[data-i]");
          if (!b) return;
          location.hash = "#/n/" + palResults[+b.dataset.i].slug;
          palClose();
        });
        scrim.addEventListener("mousedown", (e) => {
          if (e.target === scrim) palClose();
        });
        $("#btnSearch").addEventListener("click", palOpen);
        $("#btnSearch2").addEventListener("click", palOpen);

        document.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            scrim.classList.contains("on") ? palClose() : palOpen();
            return;
          }
          if (!scrim.classList.contains("on")) {
            if (
              e.key === "/" &&
              !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)
            ) {
              e.preventDefault();
              palOpen();
            }
            return;
          }
          if (e.key === "Escape") palClose();
          if (e.key === "ArrowDown") {
            e.preventDefault();
            palMove(1);
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            palMove(-1);
          }
          if (e.key === "Enter" && palResults[palSel]) {
            location.hash = "#/n/" + palResults[palSel].slug;
            palClose();
          }
        });

        /* ---------- chrome buttons ---------- */
        $("#btnTheme").addEventListener("click", () =>
          setMode(
            currentMode === "dark" ? "light" : "dark",
          ),
        );
        $("#btnLeft").addEventListener("click", () => {
          const on = document.body.dataset.left !== "on";
          document.body.dataset.left = on ? "on" : "off";
          $("#btnLeft").setAttribute("aria-pressed", String(on));
          store.set("left", on ? "on" : "off");
          $("#sideScrim").classList.toggle("on", on && innerWidth < 860);
        });
        // Theme picker
        (() => {
          const scrim = $("#themeScrim");
          const grid = $("#themeGrid");

          function buildCards() {
            grid.innerHTML = Object.entries(THEMES).map(([key, t]) => {
              const swatchBg = t.light["--bg"];
              const active = key === currentPalette ? " active" : "";
              return '<div class="theme-card' + active + '" data-key="' + key + '">' +
                '<div class="theme-swatch" style="background:' + swatchBg + '"></div>' +
                '<span class="theme-name">' + t.name + '</span>' +
                '<span class="theme-roma">' + t.romaji + '</span></div>';
            }).join("");
            grid.querySelectorAll(".theme-card").forEach((card) => {
              card.addEventListener("click", () => {
                const key = card.dataset.key;
                if (key) applyPalette(key);
                scrim.classList.remove("on");
              });
            });
          }
          buildCards();

          $("#btnAppear").addEventListener("click", () => {
            buildCards(); // refresh active state
            scrim.classList.add("on");
          });
          scrim.addEventListener("click", (e) => {
            if (e.target === scrim) scrim.classList.remove("on");
          });
        })();

        $("#sideScrim").addEventListener("click", () => {
          document.body.dataset.left = "off";
          $("#btnLeft").setAttribute("aria-pressed", "false");
          $("#sideScrim").classList.remove("on");
        });
        const widths = ["normal", "wide", "full"];
        $("#btnWidth").addEventListener("click", () => {
          const next =
            widths[
              (widths.indexOf(document.body.dataset.width) + 1) % widths.length
            ];
          document.body.dataset.width = next;
          store.set("width", next);
          toast(`Reading width: ${next}`);
          graph.resize();
        });
        $("#btnGraph").addEventListener("click", () => {
          if (!location.hash.match(/^#\/$|^$/)) {
            location.hash = "#/";
            setTimeout(() => $("#graphSec") && scrollToEl($("#graphSec")), 90);
          } else if ($("#graphSec")) scrollToEl($("#graphSec"));
        });
        $("#btnBack").addEventListener("click", () => history.back());

        /* ---------- link graph ---------- */
        graph = (() => {
          let cvs,
            ctx2,
            nodes = [],
            edges = [],
            raf = null,
            hover = null,
            drag = null,
            ready = false,
            W = 0,
            H = 0;
          const css = (v) =>
            getComputedStyle(document.documentElement)
              .getPropertyValue(v)
              .trim();

          function mount() {
            cvs = $("#graph");
            if (!cvs) return;
            ctx2 = cvs.getContext("2d");
            nodes = notes.map((n, i) => ({
              slug: n.slug,
              title: n.title,
              deg: n.in.size + n.out.size,
              x:
                Math.cos((i / notes.length) * 6.283) * 120 +
                (Math.random() - 0.5) * 20,
              y:
                Math.sin((i / notes.length) * 6.283) * 90 +
                (Math.random() - 0.5) * 20,
              vx: 0,
              vy: 0,
            }));
            const idx = new Map(nodes.map((n, i) => [n.slug, i]));
            edges = [];
            notes.forEach((n) =>
              n.out.forEach((t) => edges.push([idx.get(n.slug), idx.get(t)])),
            );
            ready = true;
            resize();
            const reduce = matchMedia(
              "(prefers-reduced-motion:reduce)",
            ).matches;
            if (reduce) {
              for (let k = 0; k < 260; k++) step();
              paint();
            } else {
              let ticks = 0;
              const loop = () => {
                step();
                paint();
                if (++ticks < 420 || drag || hover !== null)
                  raf = requestAnimationFrame(loop);
                else raf = null;
              };
              loop();
            }
            bind();
          }
          function resize() {
            if (!cvs) return;
            const r = cvs.getBoundingClientRect(),
              dpr = Math.min(devicePixelRatio || 1, 2);
            W = r.width;
            H = r.height;
            cvs.width = W * dpr;
            cvs.height = H * dpr;
            ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
            paint();
          }
          function step() {
            const cx = W / 2,
              cy = H / 2;
            for (let i = 0; i < nodes.length; i++) {
              const a = nodes[i];
              for (let j = i + 1; j < nodes.length; j++) {
                const b = nodes[j];
                let dx = b.x - a.x,
                  dy = b.y - a.y,
                  d2 = dx * dx + dy * dy || 0.01;
                if (d2 > 62500) continue;
                const f = 900 / d2,
                  d = Math.sqrt(d2);
                const ux = (dx / d) * f,
                  uy = (dy / d) * f;
                a.vx -= ux;
                a.vy -= uy;
                b.vx += ux;
                b.vy += uy;
              }
              a.vx += (cx - a.x) * 0.0016;
              a.vy += (cy - a.y) * 0.0022;
            }
            edges.forEach(([i, j]) => {
              const a = nodes[i],
                b = nodes[j];
              if (!a || !b) return;
              const dx = b.x - a.x,
                dy = b.y - a.y,
                d = Math.hypot(dx, dy) || 0.01;
              const f = (d - 96) * 0.012,
                ux = (dx / d) * f,
                uy = (dy / d) * f;
              a.vx += ux;
              a.vy += uy;
              b.vx -= ux;
              b.vy -= uy;
            });
            nodes.forEach((n) => {
              if (drag === n) return;
              n.vx *= 0.84;
              n.vy *= 0.84;
              n.x += Math.max(-6, Math.min(6, n.vx));
              n.y += Math.max(-6, Math.min(6, n.vy));
              n.x = Math.max(26, Math.min(W - 26, n.x));
              n.y = Math.max(22, Math.min(H - 22, n.y));
            });
          }
          const rad = (n) => 4 + Math.min(7, n.deg * 1.5);
          function paint() {
            if (!ctx2) return;
            const line = css("--line"),
              accent = css("--accent"),
              ink = css("--ink-2"),
              faint = css("--faint");
            ctx2.clearRect(0, 0, W, H);
            ctx2.lineWidth = 1;
            edges.forEach(([i, j]) => {
              const a = nodes[i],
                b = nodes[j];
              if (!a || !b) return;
              const lit =
                hover !== null && (nodes[hover] === a || nodes[hover] === b);
              ctx2.strokeStyle = lit ? accent : line;
              ctx2.globalAlpha = lit ? 0.85 : 0.75;
              ctx2.beginPath();
              ctx2.moveTo(a.x, a.y);
              ctx2.lineTo(b.x, b.y);
              ctx2.stroke();
            });
            ctx2.globalAlpha = 1;
            nodes.forEach((n, i) => {
              const on = hover === i;
              ctx2.beginPath();
              ctx2.arc(n.x, n.y, rad(n) + (on ? 2 : 0), 0, 6.284);
              ctx2.fillStyle = on || n.deg >= 3 ? accent : css("--bg");
              ctx2.strokeStyle = accent;
              ctx2.lineWidth = 1.6;
              ctx2.fill();
              ctx2.stroke();
              if (on || n.deg >= 3) {
                ctx2.font = `500 ${on ? 12 : 11}px Inter, system-ui, sans-serif`;
                ctx2.fillStyle = on ? ink : faint;
                ctx2.textAlign = "center";
                const label =
                  n.title.length > 26 ? n.title.slice(0, 25) + "…" : n.title;
                ctx2.fillText(label, n.x, n.y - rad(n) - 7);
              }
            });
          }
          function at(e) {
            const r = cvs.getBoundingClientRect(),
              x = e.clientX - r.left,
              y = e.clientY - r.top;
            for (let i = 0; i < nodes.length; i++)
              if (
                Math.hypot(nodes[i].x - x, nodes[i].y - y) <
                rad(nodes[i]) + 7
              )
                return i;
            return null;
          }
          function kick() {
            if (!raf) {
              let t = 0;
              const loop = () => {
                step();
                paint();
                if (++t < 200 || drag) raf = requestAnimationFrame(loop);
                else raf = null;
              };
              loop();
            }
          }
          let boundWindow = false;
          function bind() {
            // the canvas is re-created on every visit to the index, so re-bind it each time
            cvs.addEventListener("mousemove", (e) => {
              if (drag) {
                const r = cvs.getBoundingClientRect();
                drag.x = e.clientX - r.left;
                drag.y = e.clientY - r.top;
                drag.vx = drag.vy = 0;
                paint();
                return;
              }
              const h = at(e);
              if (h !== hover) {
                hover = h;
                cvs.style.cursor = h === null ? "grab" : "pointer";
                paint();
              }
            });
            cvs.addEventListener("mousedown", (e) => {
              const h = at(e);
              if (h !== null) {
                drag = nodes[h];
                kick();
              }
            });
            cvs.addEventListener("mouseleave", () => {
              hover = null;
              paint();
            });
            cvs.addEventListener("click", (e) => {
              const h = at(e);
              if (h !== null) location.hash = "#/n/" + nodes[h].slug;
            });
            if (!boundWindow) {
              boundWindow = true;
              addEventListener("mouseup", () => {
                if (drag) {
                  drag = null;
                  kick();
                }
              });
            }
          }
          addEventListener("resize", () => {
            if (ready) resize();
          });
          return {
            mount,
            paint: () => ready && paint(),
            resize: () => ready && resize(),
            get ready() {
              return ready;
            },
          };
        })();

        /* ---------- router ---------- */
        function route() {
          if (spy) {
            view.removeEventListener("scroll", spy);
            spy = null;
          }
          const h = location.hash || "#/";
          const q = h.split("?")[1] || "";
          const frag = new URLSearchParams(q).get("h");
          let m;
          if ((m = h.match(/^#\/n\/([^?]+)/)))
            renderNote(decodeURIComponent(m[1]), frag);
          else if ((m = h.match(/^#\/tag\/([^?]+)/)))
            renderTag(decodeURIComponent(m[1]).toLowerCase());
          else {
            document.title = DATA.name || "Study Vault";
            renderIndex();
          }
          peek.classList.remove("on");
          // GA4: track SPA page view (hash URLs)
          gtag('config', 'G-6ZPNG4BVK1', { page_path: h });
          if (innerWidth < 860 && document.body.dataset.left === "on") {
            document.body.dataset.left = "off";
            $("#btnLeft").setAttribute("aria-pressed", "false");
            $("#sideScrim").classList.remove("on");
          }
        }
        addEventListener("hashchange", route);

        /* ---------- boot ---------- */
        buildTree();
        if (!notes.length) {
          crumbs([{label: "Study Vault"}]);
          view.innerHTML = `<div class="pad"><div class="wrap" style="padding-top:90px"><div class="empty">
    <b>The vault is empty</b>Drop Markdown files into <code>content/notes/</code>, run <code>python3 build.py</code>, and they'll appear here.</div></div></div>`;
        } else {
          route();
        }
        addEventListener("load", () =>
          setTimeout(() => MD.renderMath(document.body), 60),
        );
      })();
    </script>
  </body>
</html>
