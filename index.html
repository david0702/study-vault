<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Study Vault</title>
    <meta
      name="description"
      content="A personal vault of study notes — read in the browser, download as PDF."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6ZPNG4BVK1"></script>

      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D97757'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23FAF9F5' stroke-width='2.5'/%3E%3Cpath d='M10 10 L22 22 M22 10 L10 22' stroke='%23FAF9F5' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      /* ============================================================
   Study Vault — Claude-inspired palette, Obsidian-inspired shell
   ============================================================ */

      @font-face {
        font-family: "上古明朝体";
        src: url("fonts/ShangguSerifJP-Medium.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "更沙黑体";
        src: url("fonts/Sarasa Gothic J.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "更沙黑体";
        src: url("fonts/Sarasa Gothic J Semibold.ttf") format("truetype");
        font-weight: 600;
        font-style: normal;
      }
      :root {
        /* 韵 Yun — warm earth */
        --bg: #f0e8d0;
        --surface: #f5efe0;
        --card: #fdfaf4;
        --card-2: #ffffff;
        --ink: #2d2318;
        --ink-2: #4d3f30;
        --muted: #7a6b58;
        --faint: #a69884;
        --line: #e0d5bd;
        --line-soft: #e9dfcb;
        --accent: #c7653c;
        --accent-ink: #a04528;
        --accent-soft: rgba(199, 101, 60, 0.12);
        --accent-line: rgba(199, 101, 60, 0.34);
        --ok: #5a8a5c;
        --warn: #c2913f;
        --info: #5b7fa6;
        --input-bg: rgba(0, 0, 0, 0.04);
        --scrim-bg: rgba(20, 20, 19, 0.35);
        --shadow-1: 0 1px 2px rgba(45, 35, 24, 0.06);
        --shadow-2:
          0 2px 6px rgba(45, 35, 24, 0.07), 0 12px 32px rgba(45, 35, 24, 0.08);
        --shadow-3: 0 20px 60px rgba(45, 35, 24, 0.16);

        --sans:
          "更沙黑体", "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        --serif:
          "上古明朝体", "霞鹜致宋", "方正准雅宋", "Source Serif 4",
          "Iowan Old Style", Charter, Georgia, "Times New Roman", serif;
        --mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;

        --ribbon-w: 52px;
        --left-w: 266px;
        --right-w: 250px;
        --topbar-h: 46px;
        --read-w: 44rem;
        --radius: 10px;
        --radius-lg: 16px;
      }

      [data-theme="dark"] {
        /* 韵 Yun — dark */
        --bg: #594636;
        --surface: #4d3c2e;
        --card: #423326;
        --card-2: #382a1f;
        --ink: #efe4d4;
        --ink-2: #d4c8b4;
        --muted: #a6947e;
        --faint: #8a7a66;
        --line: #6b5a46;
        --line-soft: #5e4e3c;
        --accent: #e89464;
        --accent-ink: #f0b898;
        --accent-soft: rgba(232, 148, 100, 0.14);
        --accent-line: rgba(232, 148, 100, 0.36);
        --ok: #7aae7e;
        --warn: #d4ac63;
        --info: #84a6c9;
        --input-bg: rgba(0, 0, 0, 0.22);
        --scrim-bg: rgba(0, 0, 0, 0.5);
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-2:
          0 2px 8px rgba(0, 0, 0, 0.28), 0 14px 34px rgba(0, 0, 0, 0.34);
        --shadow-3: 0 24px 70px rgba(0, 0, 0, 0.5);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }
      /* smooth theme transitions */
      html,
      body,
      .ribbon,
      .side,
      .topbar,
      .main,
      .view,
      .tree-folder,
      .tree-file,
      .tree-cat-head,
      .md pre,
      .md code,
      .md blockquote,
      .md table,
      .note-head,
      .hero,
      .palette,
      .theme-pop,
      .scrim,
      input,
      .kbd-hint,
      kbd,
      button.rib,
      .tbtn,
      .vsearch,
      .mark,
      .theme-card {
        transition:
          background-color 0.28s ease,
          color 0.22s ease,
          border-color 0.28s ease,
          box-shadow 0.32s ease;
      }
      @media (prefers-reduced-motion) {
        html,
        body,
        .ribbon,
        .side,
        .topbar,
        .main,
        .view,
        .tree-folder,
        .tree-file,
        .tree-cat-head,
        .md pre,
        .md code,
        .md blockquote,
        .md table,
        .note-head,
        .hero,
        .palette,
        .theme-pop,
        .scrim,
        input,
        .kbd-hint,
        kbd,
        button.rib,
        .tbtn,
        .vsearch,
        .mark,
        .theme-card {
          transition: none;
        }
      }
      ::selection {
        background: var(--accent-soft);
        color: var(--ink);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      svg {
        display: block;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      /* scrollbars */
      .scroll {
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      .scroll::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      .scroll::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 99px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      .scroll::-webkit-scrollbar-thumb:hover {
        background: var(--faint);
        background-clip: content-box;
        border: 3px solid transparent;
      }
      .scroll::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ---------- App shell ---------- */
      .app {
        display: grid;
        height: 100dvh;
        grid-template-columns: var(--ribbon-w) var(--left-w) minmax(0, 1fr) var(
            --right-w
          );
        grid-template-rows: 100dvh;
      }
      body[data-left="off"] .app {
        grid-template-columns: var(--ribbon-w) 0 minmax(0, 1fr) var(--right-w);
      }
      body[data-right="off"] .app {
        grid-template-columns: var(--ribbon-w) var(--left-w) minmax(0, 1fr) 0;
      }
      body[data-left="off"][data-right="off"] .app {
        grid-template-columns: var(--ribbon-w) 0 minmax(0, 1fr) 0;
      }

      /* ---------- Ribbon ---------- */
      .ribbon {
        background: var(--surface);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 10px 0 12px;
      }
      .mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--accent);
        display: grid;
        place-items: center;
        margin-bottom: 10px;
        box-shadow: var(--shadow-1);
        transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.3, 1);
        overflow: hidden;
      }
      .mark-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 9px;
      }
      .mark:hover {
        transform: rotate(-6deg) scale(1.06);
      }
      .rib {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: var(--muted);
        transition:
          background 0.14s,
          color 0.14s;
      }
      .rib:hover {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .rib[aria-pressed="true"],
      .rib.is-on {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .rib-sp {
        flex: 1;
      }

      /* ---------- Sidebars ---------- */
      .side {
        background: var(--surface);
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }
      .side-l {
        border-right: 1px solid var(--line);
      }
      .side-r {
        border-left: 1px solid var(--line);
      }
      .side-head {
        height: var(--topbar-h);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px 0 14px;
        border-bottom: 1px solid var(--line-soft);
        flex: 0 0 auto;
      }
      .side-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .side-body {
        flex: 1;
        min-height: 0;
        padding: 8px 8px 28px;
        font-weight: 600;
      }
      .side-r .side-body {
        padding: 12px 12px 28px;
      }

      /* vault search */
      .vsearch {
        position: relative;
        padding: 6px 6px 10px;
      }
      .vsearch input {
        width: 100%;
        background: var(--card-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px 7px 30px;
        font-size: 13px;
        color: var(--ink);
        transition:
          border-color 0.14s,
          box-shadow 0.14s;
      }
      [data-theme="dark"] .vsearch input {
        background: var(--input-bg);
      }
      .vsearch input::placeholder {
        color: var(--faint);
      }
      .vsearch input:focus {
        outline: none;
        border-color: var(--accent-line);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .vsearch svg {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-60%);
        color: var(--faint);
      }

      /* file tree */
      .tree {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .tree-folder > .row {
        color: var(--ink-2);
        font-weight: 500;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        text-align: left;
        padding: 5px 8px;
        border-radius: 7px;
        font-size: 13.5px;
        color: var(--ink-2);
        transition:
          background 0.12s,
          color 0.12s;
        position: relative;
      }
      .row:hover {
        background: var(--accent-soft);
      }
      .row .chev {
        transition: transform 0.16s ease;
        color: var(--faint);
        flex: 0 0 auto;
      }
      .tree-folder.collapsed .chev {
        transform: rotate(-90deg);
      }
      .tree-folder.collapsed > .tree-kids {
        display: none;
      }
      .tree-cat-head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 4px 6px;
        color: var(--faint);
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        user-select: none;
      }
      .tree-cat-head::before,
      .tree-cat-head::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .tree-cat > .tree-kids {
        margin-left: 0;
        padding-left: 0;
        border-left: none;
      }
      .row .fname {
        word-break: break-word;
        line-height: 1.4;
      }
      .tree-kids {
        list-style: none;
        margin: 2px 0 2px 10px;
        padding-left: 9px;
        border-left: 1px solid var(--line);
      }
      .file .row {
        color: var(--muted);
      }
      .file .row:hover {
        color: var(--ink);
      }
      .file.active > .row {
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-weight: 500;
      }
      .file.active > .row::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--accent);
        border-radius: 2px;
      }
      .dot-pdf {
        margin-left: auto;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--faint);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 4px;
        line-height: 15px;
      }
      .file.active .dot-pdf {
        border-color: var(--accent-line);
        color: var(--accent-ink);
      }

      /* ---------- Main ---------- */
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--bg);
      }
      .topbar {
        height: var(--topbar-h);
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      .tbtn {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        color: var(--muted);
        transition:
          background 0.14s,
          color 0.14s;
      }
      .tbtn:hover {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .tbtn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .tbtn:disabled:hover {
        background: none;
        color: var(--muted);
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--faint);
        min-width: 0;
        margin-left: 4px;
      }
      .crumbs a:hover {
        color: var(--accent-ink);
      }
      .crumbs .cur {
        color: var(--ink-2);
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tb-sp {
        flex: 1;
      }
      .kbd-hint {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--faint);
        border: 1px solid var(--line);
        background: var(--card-2);
        border-radius: 8px;
        padding: 5px 9px;
        transition:
          border-color 0.14s,
          color 0.14s;
      }
      [data-theme="dark"] .kbd-hint {
        background: var(--input-bg);
      }
      .kbd-hint:hover {
        border-color: var(--accent-line);
        color: var(--ink-2);
      }
      kbd {
        font-family: var(--sans);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 1px 5px;
        color: var(--muted);
        background: var(--surface);
      }

      .view {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .pad {
        padding: 0 40px 30vh;
      }
      .wrap {
        max-width: var(--read-w);
        margin: 0 auto;
      }
      body[data-width="wide"] {
        --read-w: 56rem;
      }
      body[data-width="full"] {
        --read-w: 100%;
      }

      /* ---------- Index / dashboard ---------- */
      .hero {
        padding: 64px 0 30px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 30px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--accent-ink);
        background: var(--accent-soft);
        border-radius: 99px;
        padding: 4px 11px;
        margin-bottom: 20px;
      }
      .eyebrow .pulse {
        width: 6px;
        height: 6px;
        border-radius: 99px;
        background: var(--accent);
      }
      h1.vault-name {
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(2.4rem, 5.2vw, 3.5rem);
        line-height: 1.06;
        letter-spacing: -0.024em;
        margin: 0 0 16px;
        color: var(--ink);
      }
      .vault-suffix {
        font-size: 0.5em;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: 0.02em;
        margin-left: 0.08em;
      }
      .vault-sub {
        font-size: 16.5px;
        line-height: 1.62;
        color: var(--muted);
        max-width: 46ch;
        margin: 0 0 10px;
      }
      .vault-sub em {
        font-style: italic;
        color: var(--ink-2);
      }
      .home-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        color: var(--faint);
        text-decoration: none;
        margin-bottom: 24px;
        transition: color 0.2s;
      }
      .home-btn:hover {
        color: var(--accent-ink);
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
      }
      .stat .n {
        font-family: var(--serif);
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .stat .l {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--faint);
        margin-top: 3px;
      }

      .sec {
        margin: 0 0 34px;
      }
      .sec-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin: 0 0 14px;
      }
      .sec-title {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .sec-rule {
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .sec-note {
        font-size: 12px;
        color: var(--faint);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        font-size: 12.5px;
        color: var(--muted);
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 99px;
        padding: 4px 11px;
        transition: all 0.14s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .chip:hover {
        border-color: var(--accent-line);
        color: var(--accent-ink);
      }
      .chip[aria-pressed="true"],
      .chip[aria-current="page"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fbfaf7;
      }
      .chip .c {
        font-size: 11px;
        opacity: 0.65;
        font-variant-numeric: tabular-nums;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
        gap: 14px;
      }
      .card {
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 18px 18px 15px;
        position: relative;
        overflow: hidden;
        transition:
          border-color 0.18s,
          transform 0.18s cubic-bezier(0.2, 0.8, 0.3, 1),
          box-shadow 0.18s;
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 2px;
        background: var(--accent);
        transform: scaleY(0);
        transform-origin: top;
        transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .card:hover {
        border-color: var(--accent-line);
        transform: translateY(-2px);
        box-shadow: var(--shadow-2);
      }
      .card:hover::after {
        transform: scaleY(1);
      }
      .card-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 11px;
      }
      .folder-tag {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .pdf-badge {
        margin-left: auto;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--accent-ink);
        background: var(--accent-soft);
        border-radius: 5px;
        padding: 2px 6px;
      }
      .card h3 {
        font-family: var(--serif);
        font-size: 19.5px;
        font-weight: 600;
        letter-spacing: -0.012em;
        line-height: 1.28;
        margin: 0 0 8px;
        color: var(--ink);
      }
      .card p {
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--muted);
        margin: 0 0 14px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        color: var(--faint);
        padding-top: 11px;
        border-top: 1px solid var(--line-soft);
      }
      .card-foot .sep {
        width: 3px;
        height: 3px;
        border-radius: 99px;
        background: var(--line);
      }
      .tag-mini {
        color: var(--accent-ink);
        font-weight: 500;
      }

      .empty {
        text-align: center;
        padding: 52px 20px;
        border: 1px dashed var(--line);
        border-radius: var(--radius-lg);
        color: var(--muted);
        background: var(--card);
      }
      .empty b {
        display: block;
        font-family: var(--serif);
        font-size: 18px;
        color: var(--ink);
        margin-bottom: 6px;
        font-weight: 600;
      }

      /* graph */
      .graph-shell {
        position: relative;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--card);
        overflow: hidden;
      }
      #graph {
        display: block;
        width: 100%;
        height: 290px;
        cursor: grab;
      }
      #graph:active {
        cursor: grabbing;
      }
      .graph-legend {
        position: absolute;
        left: 14px;
        bottom: 12px;
        font-size: 11px;
        color: var(--faint);
        display: flex;
        gap: 14px;
        align-items: center;
        pointer-events: none;
      }
      .graph-legend i {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--accent);
        display: inline-block;
        margin-right: 6px;
      }
      .graph-legend i.hub {
        width: 12px;
        height: 12px;
      }

      /* ---------- Note view ---------- */
      .note-head {
        padding: 56px 0 0;
      }
      .note-kicker {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 16px;
      }
      h1.note-title {
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(2rem, 4vw, 2.7rem);
        line-height: 1.14;
        letter-spacing: -0.022em;
        margin: 0 0 14px;
        color: var(--ink);
      }
      .note-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 9px;
        font-size: 12.5px;
        color: var(--faint);
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }
      .note-meta .sep {
        width: 3px;
        height: 3px;
        border-radius: 99px;
        background: var(--line);
      }
      .note-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 16px 0 0;
      }

      /* pdf panel */
      .pdf-panel {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 24px 0 4px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
      }
      .pdf-ico {
        width: 34px;
        height: 42px;
        flex: 0 0 auto;
        border-radius: 4px;
        border: 1px solid var(--accent-line);
        background: var(--accent-soft);
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .pdf-txt {
        min-width: 0;
        flex: 1;
      }
      .pdf-txt b {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pdf-txt span {
        font-size: 12px;
        color: var(--faint);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13.5px;
        font-weight: 500;
        transition: all 0.15s;
        white-space: nowrap;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: var(--accent);
        color: #fbfaf7;
        box-shadow: var(--shadow-1);
      }
      .btn-primary:hover {
        background: var(--accent-ink);
      }
      .btn-ghost {
        border-color: var(--line);
        color: var(--ink-2);
        background: var(--card-2);
      }
      .btn-ghost:hover {
        border-color: var(--accent-line);
        color: var(--accent-ink);
      }
      .pdf-frame {
        margin: 12px 0 0;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--card-2);
      }
      .pdf-frame iframe {
        display: block;
        width: 100%;
        height: min(70vh, 720px);
        border: 0;
      }

      /* ---------- Rendered markdown ---------- */
      .md {
        font-family: var(--serif);
        font-size: 17.5px;
        line-height: 1.55;
        color: var(--ink-2);
        padding-top: 8px;
      }
      .md > *:first-child {
        margin-top: 0;
      }
      .md p {
        margin: 0 0 1.15em;
      }
      .md h2,
      .md h3,
      .md h4 {
        font-family: var(--serif);
        color: var(--heading);
        letter-spacing: -0.015em;
        scroll-margin-top: 70px;
      }
      .md h2 {
        font-size: 1.55em;
        font-weight: 600;
        line-height: 1.25;
        margin: 2em 0 0.6em;
        padding-bottom: 0.28em;
        border-bottom: 1px solid var(--line);
      }
      .md h3 {
        font-size: 1.22em;
        font-weight: 600;
        line-height: 1.3;
        margin: 1.7em 0 0.5em;
      }
      .md h4 {
        font-size: 1.02em;
        font-weight: 600;
        margin: 1.5em 0 0.4em;
        color: var(--ink-2);
      }
      .md h2 .anchor,
      .md h3 .anchor,
      .md h4 .anchor {
        opacity: 0;
        margin-left: 0.4em;
        color: var(--accent);
        font-weight: 400;
        font-size: 0.8em;
        transition: opacity 0.14s;
      }
      .md h2:hover .anchor,
      .md h3:hover .anchor,
      .md h4:hover .anchor {
        opacity: 1;
      }
      .md strong {
        font-weight: 600;
        color: var(--strong);
      }
      .md em {
        font-style: italic;
        color: var(--em);
      }
      .md del {
        color: var(--faint);
      }
      .md mark {
        background: var(--accent-soft);
        color: var(--ink);
        padding: 0.06em 0.22em;
        border-radius: 3px;
      }
      .md a.ext {
        color: var(--accent-ink);
        text-decoration: underline;
        text-decoration-color: var(--accent-line);
        text-underline-offset: 0.18em;
        transition: text-decoration-color 0.14s;
      }
      .md a.ext:hover {
        text-decoration-color: var(--accent);
      }
      .md a.wiki {
        color: var(--accent-ink);
        border-bottom: 1px solid var(--accent-line);
        padding-bottom: 0.03em;
        transition:
          background 0.14s,
          border-color 0.14s;
        border-radius: 2px;
      }
      .md a.wiki:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .md a.wiki.dead {
        color: var(--faint);
        border-bottom-style: dashed;
        border-color: var(--line);
        cursor: help;
      }
      .md ul,
      .md ol {
        margin: 0 0 1.15em;
        padding-left: 1.35em;
      }
      .md li {
        margin: 0.32em 0;
      }
      .md li::marker {
        color: var(--faint);
      }
      .md ul.tasks {
        list-style: none;
        padding-left: 0.1em;
      }
      .md ul.tasks li {
        display: flex;
        gap: 0.6em;
        align-items: flex-start;
      }
      .md ul.tasks input {
        margin-top: 0.42em;
        accent-color: var(--accent);
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
      }
      .md ul.tasks li.done {
        color: var(--faint);
        text-decoration: line-through;
        text-decoration-color: var(--line);
      }
      .md hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 2.2em 0;
      }
      .md blockquote {
        margin: 0 0 1.15em;
        padding: 0.1em 0 0.1em 1.15em;
        border-left: 2px solid var(--accent-line);
        color: var(--muted);
        font-style: italic;
      }
      .md blockquote p:last-child {
        margin-bottom: 0;
      }
      .md code {
        font-family: var(--mono);
        font-size: 0.83em;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 5px;
        padding: 0.11em 0.34em;
        color: var(--accent-ink);
        font-style: normal;
      }
      .md pre {
        position: relative;
        margin: 0 0 1.3em;
        background: var(--card-2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 15px 16px;
        overflow-x: auto;
      }
      [data-theme="dark"] .md pre {
        background: var(--card);
      }
      .md pre code {
        background: none;
        border: 0;
        padding: 0;
        font-size: 13.5px;
        line-height: 1.66;
        color: var(--ink-2);
        font-family: var(--mono);
        display: block;
      }
      .code-lang {
        position: absolute;
        top: 0;
        right: 0;
        font-family: var(--sans);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 7px 11px;
      }
      .code-copy {
        position: absolute;
        top: 7px;
        right: 8px;
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 8px;
        opacity: 0;
        transition:
          opacity 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      .md pre:hover .code-copy {
        opacity: 1;
      }
      .md pre:hover .code-lang {
        opacity: 0;
      }
      .code-copy:hover {
        color: var(--accent-ink);
        border-color: var(--accent-line);
      }
      .md table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 1.4em;
        font-family: var(--sans);
        font-size: 14.5px;
      }
      .md th,
      .md td {
        text-align: left;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
      }
      .md th {
        font-weight: 600;
        font-size: 11.5px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--faint);
        border-bottom-color: var(--line);
      }
      .md tbody tr {
        transition: background 0.12s;
      }
      .md tbody tr:hover {
        background: var(--accent-soft);
      }
      .md img {
        max-width: 100%;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        display: block;
        margin: 0 auto 1.2em;
      }
      .md .tag-inline {
        font-family: var(--sans);
        font-size: 0.78em;
        font-weight: 500;
        color: var(--accent-ink);
        background: var(--accent-soft);
        border-radius: 99px;
        padding: 0.12em 0.55em;
        white-space: nowrap;
      }
      .md .footnote {
        font-size: 0.8em;
        vertical-align: super;
        color: var(--accent-ink);
      }
      .md .footnotes {
        margin-top: 2.4em;
        padding-top: 1em;
        border-top: 1px solid var(--line);
        font-size: 0.88em;
        color: var(--ink-2);
      }
      .md .footnotes ol {
        padding-left: 1.5em;
        margin: 0;
      }
      .md .footnotes li {
        margin: 0.45em 0;
        line-height: 1.55;
      }
      .md .footnote-backref {
        text-decoration: none;
        margin-right: 0.25em;
        color: var(--accent-ink);
        font-size: 0.85em;
      }

      /* math */
      .md .math[data-display="1"] {
        display: block;
        text-align: center;
        margin: 0.8em 0;
        font-size: 1em;
      }
      .md .math {
        font-family: var(--mono);
        font-size: 0.86em;
        color: var(--ink);
      }
      .md .math-block {
        margin: 0 0 1.3em;
        padding: 16px 18px;
        text-align: center;
        overflow-x: auto;
        border: 1px solid var(--line);
        border-left: 2px solid var(--accent-line);
        border-radius: var(--radius);
        background: var(--card);
        font-family: var(--mono);
        font-size: 0.9em;
        color: var(--ink);
      }
      .md .katex {
        font-size: 1.04em;
      }
      .md .katex-display {
        margin: 0;
      }
      .md .katex .tag {
        display: none !important;
      }

      /* callouts */
      .callout {
        margin: 0 0 1.3em;
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: var(--radius);
        background: var(--card);
        padding: 13px 16px;
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.62;
        color: var(--ink-2);
      }
      .callout-h {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        color: var(--ink);
        font-size: 14px;
        margin-bottom: 6px;
        letter-spacing: -0.005em;
      }
      .callout-h svg {
        color: var(--accent);
        flex: 0 0 auto;
      }
      .callout p:last-child {
        margin-bottom: 0;
      }
      .callout p {
        margin: 0 0 0.7em;
      }
      .callout.tip {
        border-left-color: var(--ok);
      }
      .callout.tip .callout-h svg {
        color: var(--ok);
      }
      .callout.warning {
        border-left-color: var(--warn);
      }
      .callout.warning .callout-h svg {
        color: var(--warn);
      }
      .callout.info {
        border-left-color: var(--info);
      }
      .callout.info .callout-h svg {
        color: var(--info);
      }

      /* backlinks + footer nav */
      .after {
        margin-top: 56px;
        padding-top: 26px;
        border-top: 1px solid var(--line);
      }
      .backlinks {
        display: grid;
        gap: 9px;
        margin-top: 14px;
      }
      .bl {
        display: block;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
        background: var(--card);
        transition:
          border-color 0.16s,
          transform 0.16s,
          box-shadow 0.16s;
      }
      .bl:hover {
        border-color: var(--accent-line);
        transform: translateX(2px);
        box-shadow: var(--shadow-1);
      }
      .bl b {
        display: block;
        font-family: var(--serif);
        font-size: 15.5px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 3px;
      }
      .bl span {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.55;
        display: block;
      }
      .bl span mark {
        background: var(--accent-soft);
        color: var(--accent-ink);
        border-radius: 3px;
        padding: 0 2px;
      }
      .pager {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 44px;
      }
      .pg {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 13px 15px;
        background: var(--card);
        transition:
          border-color 0.16s,
          box-shadow 0.16s;
      }
      .pg:hover {
        border-color: var(--accent-line);
        box-shadow: var(--shadow-1);
      }
      .pg small {
        display: block;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 5px;
      }
      .pg b {
        font-family: var(--serif);
        font-size: 15.5px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.3;
        display: block;
      }
      .pg.next {
        text-align: right;
      }
      .pg.ghost {
        visibility: hidden;
      }

      /* ---------- Right sidebar: outline ---------- */
      .outline {
        list-style: none;
        margin: 0;
        padding: 0;
        border-left: 1px solid var(--line);
      }
      .outline a {
        display: block;
        padding: 4px 10px;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--muted);
        border-left: 2px solid transparent;
        margin-left: -1px;
        transition:
          color 0.14s,
          border-color 0.14s;
      }
      .outline a:hover {
        color: var(--ink);
      }
      .outline a.h3 {
        padding-left: 22px;
        font-size: 12px;
      }
      .outline a.h4 {
        padding-left: 34px;
        font-size: 12px;
        color: var(--faint);
      }
      .outline a.active {
        color: var(--accent-ink);
        border-left-color: var(--accent);
        font-weight: 500;
      }
      .rblock {
        margin-bottom: 24px;
      }
      .rblock h4 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 0 0 10px;
      }
      .meta-list {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 12.5px;
      }
      .meta-list li {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 5px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      .meta-list li:last-child {
        border-bottom: 0;
      }
      .meta-list .k {
        color: var(--faint);
      }
      .meta-list .v {
        color: var(--ink-2);
        font-weight: 500;
        text-align: right;
      }
      .prog {
        height: 2px;
        background: var(--line);
        border-radius: 99px;
        overflow: hidden;
        margin-top: 2px;
      }
      .prog i {
        display: block;
        height: 100%;
        background: var(--accent);
        width: 0;
        transition: width 0.1s linear;
      }

      /* ---------- Hover page preview (Obsidian-style) ---------- */
      .peek {
        position: fixed;
        z-index: 60;
        width: 330px;
        max-height: 280px;
        overflow: hidden;
        background: var(--card-2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-2);
        padding: 15px 16px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 0.13s,
          transform 0.13s;
      }
      .peek.on {
        opacity: 1;
        transform: translateY(0);
      }
      .peek b {
        display: block;
        font-family: var(--serif);
        font-size: 16px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 6px;
      }
      .peek p {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 6;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .peek .pk-meta {
        margin-top: 9px;
        font-size: 11px;
        color: var(--faint);
        letter-spacing: 0.04em;
      }
      .peek::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 38px;
        background: linear-gradient(transparent, var(--card-2));
      }

      /* ---------- Command palette ---------- */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: rgba(20, 20, 19, 0.34);
        backdrop-filter: blur(3px);
        display: flex;
        justify-content: center;
        padding-top: 14vh;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.16s;
      }
      [data-theme="dark"] .scrim {
        background: var(--scrim-bg);
      }
      .scrim.on {
        opacity: 1;
        pointer-events: auto;
      }
      .palette {
        width: min(620px, 92vw);
        max-height: 64vh;
        display: flex;
        flex-direction: column;
        background: var(--card-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow-3);
        overflow: hidden;
        transform: translateY(-8px) scale(0.985);
        transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .scrim.on .palette {
        transform: none;
      }

   "body": "Everything you write lives in `content/notes/`. The **filename is the note's ID**.\n\n## Add a note\n\n1. Drop a Markdown file into `content/notes/`.\n2. Give it frontmatter:\n\n```yaml\n---\ntitle: \"Your note title\"\nfolder: 01 Mathematics\ntags: [calculus]\nsummary: \"One sentence used on cards and hover previews.\"\n---\n```\n\n3. Run `python3 build.py`.\n\nOnly `title` really matters; the rest have sensible defaults.\n\n## Link notes together\n\nUse `[[note-id]]` to link to another note. Links are **two-way**: when this note links to [[markdown-guide]], that note automatically grows a *Linked from* entry and a node in the graph.\n\n## See the result\n\nThe graph on the home page draws a node per note and an edge per link. Try `Ctrl+K` to open the quick switcher.\n\n#tutorial\n"

  {
   "slug": "how-it-works",
   "title": "这个笔记站是怎么工作的",
   "folder": "00 Maps",
   "tags": [
    "tutorial",
    "architecture"
   ],
   "created": "2026-08-13",
   "updated": "2026-08-13",
   "pdf": "",
   "summary": "拆解这个零依赖单文件笔记站的原理：数据流、路由、Markdown 引擎、链接图谱。",
   "body": "> [!note] 这是「元笔记」\n> 用这个笔记站，讲解这个笔记站自己。文中的所有语法（`[[链接]]`、标注框、代码块、表格）本身就是对原理的演示。\n\n## 一句话总结\n\n**Markdown 文件当数据库，Python 脚本当编译器，浏览器里的原生 JS 当运行时。** 没有框架、没有构建工具、没有服务端——一个 `index.html` 就是整个应用。\n\n## 三个「零」的设计哲学\n\n| 零 | 含义 | 代价 |\n| --- | --- | --- |\n| 零依赖 | 不引 React/Vue/webpack，纯手写 JS | 功能要自己造轮子 |\n| 零构建 | 没有 npm/CI，`build.py` 一步完成 | 大型站点会慢 |\n| 零服务端 | 纯静态，扔到任何主机都能跑 | 没有数据库、用户系统 |\n\n## 数据流：从 .md 到网页\n\n整个过程只有两步：\n\n```text\ncontent/notes/*.md          content/vault.json\n        │                          │\n        ▼                          ▼\n    解析 frontmatter           { name, tagline }\n        │                          │\n        └──────────┬───────────────┘\n                   ▼\n              build.py\n                   │  把结果写成 window.VAULT = {...}\n                   ▼\n     index.html 里 /*VAULT:START*/ 和 /*VAULT:END*/ 之间\n```\n\n核心约定：**文件名就是笔记的 ID**。`bayes-theorem.md` 会被别处用 `[[bayes-theorem]]` 引用，`_` 开头的文件（如 `_template.md`）不发布。\n\n## 单文件里装了什么\n\n`index.html` 四块内容，用内联 `<style>` 和 `<script>` 全塞在一个文件里：\n\n- **CSS 设计系统** —— 所有颜色/字体/间距都是 `:root` 里的 CSS 变量，改 `--accent` 就能换主题色\n- **HTML 布局** —— 左侧图标栏 + 文件浏览器 + 主视图 + 右侧大纲，CSS Grid 四列\n- **内嵌 JSON** —— `window.VAULT`，就是 build.py 生成的全部笔记数据\n- **JS 应用** —— 路由、Markdown 渲染、力导向图、命令面板\n\n## 路由：hash 就是 URL\n\n没有服务器，所以用 URL 里 `#` 后面的部分（hash）当路由，监听 `hashchange` 事件：\n\n| hash | 视图 |\n| --- | --- |\n| `#/` | 首页仪表盘 |\n| `#/n/how-it-works` | 本篇笔记 |\n| `#/tag/tutorial` | 标签过滤页 |\n\n所以这个站刷新、分享链接都不会丢状态——因为「页面状态」全在 URL 的 hash 里。\n\n## Markdown 引擎：占位符技巧\n\n自己写的解析器约 200 行，核心是一个「先藏起来，再还原」的技巧：\n\n```text\n原文      `content/notes/`\n  │  第一步：把行内代码替换成占位符（防止后续处理破坏它）\n  ▼\n占位符    U+E000 · C · 0 · U+E000\n  │  中间：正常处理加粗、链接、标签等\n  ▼\n  │  第二步：把占位符还原成 <code>content/notes/</code>\n  ▼\n结果      <code>content/notes/</code>\n```\n\n> [!warning] 这里刚修过一个 bug\n> 代码占位符的结尾分隔符原本写成了 U+0000（空字符），但还原时去找的是 U+E000，对不上，导致占位符漏到页面（显示成「□C0」）。数学公式的占位符就是对的，只有行内代码写错了。\n\n## 链接图谱：链接才是目录\n\n笔记之间用 `[[wikilink]]` 关联。**链接是双向的**：当 [[getting-started]] 链接到 [[markdown-guide]]，后者的「引用自」列表和首页图谱里会自动多一条边——不需要手动维护索引。\n\n图谱本身是 Canvas 2D 画的力导向图：\n\n- **斥力** —— 节点两两排斥\n- **引力** —— 拉向画布中心\n- **弹簧力** —— 有边相连的节点被拉向目标距离\n- **阻尼** —— 每帧速度衰减\n\n跑约 420 帧后自动休眠省电，拖拽或 hover 时才唤醒。\n\n## 你能改什么\n\n- 站点名/介绍 → 编辑 `content/vault.json`\n- 配色 → 改 `index.html` 顶部 `:root` 里的 `--accent`\n- 加笔记 → 往 `content/notes/` 扔一个 `.md`，跑 `python3 build.py`\n\n想继续探索，看 [[welcome]]、[[getting-started]]、[[markdown-guide]]。\n\n#tutorial #architecture\n"
  },

   "body": "This is a **zero-dependency notes site**: write Markdown files, run one command, get a static site you can host anywhere. No framework, no build tooling — `index.html` is the entire application.\n\n> [!note] Where to start\n> Read the two example notes below. They link to each other, which is the whole point: **links, not folders, are the table of contents.**\n\n## Example notes\n\n- [[getting-started|Getting started]] — how to add, edit, and organise notes\n- [[markdown-guide|Markdown guide]] — every syntax this site supports\n- [[how-it-works|How it works]] — the principles behind this single-file site\n\n## Conventions\n\n| Convention | Why |\n| --- | --- |\n| One idea per note | Notes that argue two things get linked from nowhere |\n| Links over folders | Folders are shelves; links are the argument |\n| Filename = ID | `bayes-theorem.md` is linked as `[[bayes-theorem]]` |\n\n#moc #index\n"

    <script>
      /* ---- image name → path map (populate with your own image paths) ---- */
      window.IMG_MAP = {};
    </script>

    <script>
      /* ============================================================
   Markdown → HTML
   Supports: headings, emphasis, code, fences, tables, lists,
   task lists, quotes, callouts, wikilinks, #tags, ==highlight==,
   images, hr, and $math$ (rendered by KaTeX when available).
   ============================================================ */
      const MD = (() => {
        const esc = (s) =>
          s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        const slugify = (s) =>
          s
            .toLowerCase()
            .trim()
            .replace(/[`*_~$\\]/g, "")
            .replace(/<[^>]+>/g, "")
            .replace(/[^\p{L}\p{N}\s-]/gu, "")
            .replace(/\s+/g, "-")
            .replace(/-+/g, "-")
            .replace(/^-|-$/g, "");

        const CALLOUT_ICONS = {
          note: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8h.01M11 12h1v4h1"/><circle cx="12" cy="12" r="9"/></svg>',
          tip: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .9 1.6h5.2c.1-.6.4-1.2.9-1.6A6 6 0 0 0 12 3Z"/></svg>',
          warning:
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.3 2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0ZM12 9v4M12 17h.01"/></svg>',
          info: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>',
        };
        const CALLOUT_ALIAS = {
          note: "note",
          abstract: "note",
          summary: "note",
          quote: "note",
          tip: "tip",
          hint: "tip",
          success: "tip",
          check: "tip",
          done: "tip",
          example: "tip",
          warning: "warning",
          caution: "warning",
          attention: "warning",
          danger: "warning",
          error: "warning",
          bug: "warning",
          info: "info",
          todo: "info",
          question: "info",
          faq: "info",
        };

        /* ---------- inline ---------- */
        function inline(text, ctx) {
          const codes = [];
          text = text.replace(
            /`([^`]+?)`/g,
            (_, c) =>
              `\uE000C${codes.push(`<code>${esc(c)}</code>`) - 1}\uE000`,
          );

          const maths = [];
          // display math inline: $$ ... $$
          text = text.replace(
            /\$\$(.+?)\$\$/g,
            (_, m) =>
              `M${maths.push(`<span class="math math-block" data-tex="${esc(m)}" data-display="1">${esc(m)}</span>`) - 1}`,
          );
          // inline math: $...$
          text = text.replace(
            /\$([^$\n]+?)\$/g,
            (_, m) =>
              `M${maths.push(`<span class="math" data-tex="${esc(m)}">${esc(m)}</span>`) - 1}`,
          )

          // font & center tags → placeholders
          const htmlTags = [];
          text = text.replace(
            /<font\s+color="([^"]*)">/gi,
            (_, color) => `H${htmlTags.push(`<span style="color:${color}">`) - 1}`,
          );
          text = text.replace(
            /<\/font>/gi,
            () => `H${htmlTags.push("</span>") - 1}`,
          );
          text = text.replace(
            /<center>/gi,
            () => `H${htmlTags.push(`<div style="text-align:center">`) - 1}`,
          );
          text = text.replace(
            /<\/center>/gi,
            () => `H${htmlTags.push("</div>") - 1}`,
          );

          text = esc(text);
          text = text.replace(
            /&lt;(\/?)(sub|sup|br|kbd|u|small)\s*\/?&gt;/gi,
            "<$1$2>",
          );
          // Restore font/center
          text = text.replace(
            /H(\d+)/g,
            (_, i) => htmlTags[i],
          );

          // images then links
          // Obsidian-style ![[filename.png|500|center]]
          text = text.replace(
            /!\[\[([^\]|]+)(?:\|(\d+))?(?:\|(center))?\]\]|!\[\[([^\]|]+)(?:\|(center))?(?:\|(\d+))?\]\]/g,
            (_, name1, w1, c1, name2, c2, w2) => {
              const name = (name1 || name2 || "").trim();
              const width = w1 || w2 || "";
              const center = c1 || c2 || "";
              const path =
                (window.IMG_MAP && window.IMG_MAP[name]) || name;
              const w = width ? ` width="${width}"` : "";
              const c = center ? ' style="display:block;margin:0 auto"' : "";
              return `<img src="${path}" alt="${name}" loading="lazy"${w}${c}>`;
            },
          );
          text = text.replace(
            /!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,
            (_, alt, src) => `<img src="${src}" alt="${alt}" loading="lazy">`,
          );
          text = text.replace(
            /\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,
            (_, t, href) =>
              `<a class="ext" href="${href}" target="_blank" rel="noopener">${t}</a>`,
          );

          // wikilinks [[slug|label]] / [[slug#heading]]
          text = text.replace(
            /\[\[([^\]|#]+)(?:#([^\]|]+))?(?:\|([^\]]+))?\]\]/g,
            (_, target, hash, label) => {
              const key = target.trim();
              const note = ctx && ctx.resolve ? ctx.resolve(key) : null;
              const text0 = (label || (hash ? `${key} › ${hash}` : key)).trim();
              if (!note)
                return `<a class="wiki dead" title="No note named “${key}” yet" href="#/">${text0}</a>`;
              const frag = hash
                ? `?h=${encodeURIComponent(slugify(hash))}`
                : "";
              return `<a class="wiki" data-slug="${note.slug}" href="#/n/${note.slug}${frag}">${text0}</a>`;
            },
          );

          text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          text = text.replace(/(^|[^a-zA-Z0-9*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
          text = text.replace(/(^|[^a-zA-Z0-9_])\_([^_\n]+)\_/g, "$1<em>$2</em>");
          text = text.replace(/~~([^~]+)~~/g, "<del>$1</del>");
          text = text.replace(/==([^=]+)==/g, "<mark>$1</mark>");

          // #tags — not inside words, not headings (handled at block level)
          text = text.replace(
            /(^|[\s(])#([a-zA-Z][\w-]{1,40})/g,
            (_, pre, tag) =>
              `${pre}<a class="tag-inline" href="#/tag/${tag.toLowerCase()}">#${tag}</a>`,
          );

          // footnotes [^n]
          text = text.replace(
            /\[\^(\w+)\]/g,
            '<sup class="footnote" id="fnref-$1"><a href="#fn-$1">$1</a></sup>',
          );

          text = text.replace(/\uE000M(\d+)\uE000/g, (_, i) => maths[+i]);
          text = text.replace(/\uE000C(\d+)\uE000/g, (_, i) => codes[+i]);
          return text;
        }

        /* ---------- block ---------- */
        function parse(src, ctx = {}) {
          const headings = [];
          const out = [];
          const lines = src.replace(/\r\n?/g, "\n").split("\n");

          // collect footnote definitions [^n]: text  (strip before parse)
          const footnotes = {};
          const fnDefRe = /^\[\^(\w+)\]:\s+(.+)$/;
          for (let li = lines.length - 1; li >= 0; li--) {
            const m = lines[li].match(fnDefRe);
            if (m) { footnotes[m[1]] = m[2]; lines.splice(li, 1); }
          }

          let i = 0;

          const flushPara = (buf) => {
            if (buf.length) {
              out.push(`<p>${inline(buf.join(" "), ctx)}</p>`);
              buf.length = 0;
            }
          };
          const para = [];

          while (i < lines.length) {
            const line = lines[i];

            // fenced code
            const fence = line.match(/^```\s*([\w+-]*)\s*$/);
            if (fence) {
              const lang = fence[1] || "";
              const body = [];
              i++;
              while (i < lines.length && !/^```\s*$/.test(lines[i]))
                body.push(lines[i++]);
              i++;
              flushPara(para);
              out.push(
                `<pre><span class="code-lang">${esc(lang || "text")}</span>` +
                  `<button class="code-copy" type="button">Copy</button>` +
                  `<code>${esc(body.join("\n"))}</code></pre>`,
              );
              continue;
            }

            // display math
            if (/^\$\$\s*$/.test(line) || /^\$\$.+\$\$\s*$/.test(line)) {
              flushPara(para);
              let tex;
              const one = line.match(/^\$\$(.+)\$\$\s*$/);
              if (one) {
                tex = one[1];
                i++;
              } else {
                const body = [];
                i++;
                while (i < lines.length && !/^\$\$\s*$/.test(lines[i]))
                  body.push(lines[i++]);
                i++;
                tex = body.join("\n");
              }
              out.push(
                `<div class="math-block" data-tex="${esc(tex)}" data-display="1">${esc(tex)}</div>`,
              );
              continue;
            }

            // heading
            const h = line.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
            if (h) {
              flushPara(para);
              const level = Math.min(h[1].length, 4);
              const raw = h[2].trim();
              const id = slugify(raw);
              if (level >= 2)
                headings.push({id, level, text: raw.replace(/[*_`]/g, "")});
              out.push(
                `<h${level} id="${id}">${inline(raw, ctx)}<a class="anchor" href="#${id}" data-id="${id}" aria-label="Link to section">#</a></h${level}>`,
              );
              i++;
              continue;
            }

            // hr
            if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
              flushPara(para);
              out.push("<hr>");
              i++;
              continue;
            }

            // blockquote / callout
            if (/^>\s?/.test(line)) {
              flushPara(para);
              const block = [];
              while (i < lines.length && /^>\s?/.test(lines[i]))
                block.push(lines[i++].replace(/^>\s?/, ""));
              const co = block[0] && block[0].match(/^\[!(\w+)\]\s*(.*)$/);
              if (co) {
                const kind = CALLOUT_ALIAS[co[1].toLowerCase()] || "note";
                const title =
                  co[2].trim() ||
                  co[1][0].toUpperCase() + co[1].slice(1).toLowerCase();
                const inner = parse(block.slice(1).join("\n"), ctx).html;
                out.push(
                  `<div class="callout ${kind}"><div class="callout-h">${CALLOUT_ICONS[kind]}<span>${inline(title, ctx)}</span></div>${inner}</div>`,
                );
              } else {
                out.push(
                  `<blockquote>${parse(block.join("\n"), ctx).html}</blockquote>`,
                );
              }
              continue;
            }

            // table
            if (
              /^\s*\|.+\|\s*$/.test(line) &&
              /^\s*\|[\s:-]+\|(\s*[\s:-]+\|)*\s*$/.test(lines[i + 1] || "")
            ) {
              flushPara(para);
              const cells = (r) =>
                r
                  .trim()
                  .replace(/^\||\|$/g, "")
                  .split(/(?<!\\)\|/)
                  .map((c) => c.trim().replace(/\\\|/g, "|"));
              const head = cells(lines[i]);
              i += 2;
              const rows = [];
              while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]))
                rows.push(cells(lines[i++]));
              out.push(
                `<table><thead><tr>${head.map((c) => `<th>${inline(c, ctx)}</th>`).join("")}</tr></thead>` +
                  `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c, ctx)}</td>`).join("")}</tr>`).join("")}</tbody></table>`,
              );
              continue;
            }

            // lists
            if (/^\s*(?:[-*+]|\d+[.)])\s+/.test(line)) {
              flushPara(para);
              const items = [];
              while (
                i < lines.length &&
                (/^\s*(?:[-*+]|\d+[.)])\s+/.test(lines[i]) ||
                  (/^\s{2,}\S/.test(lines[i]) && items.length))
              ) {
                const m = lines[i].match(/^(\s*)(?:([-*+])|(\d+)[.)])\s+(.*)$/);
                if (m)
                  items.push({
                    indent: Math.floor(m[1].length / 2),
                    ordered: !!m[3],
                    text: m[4],
                  });
                else if (items.length)
                  items[items.length - 1].text += " " + lines[i].trim();
                i++;
              }
              out.push(buildList(items, 0, ctx).html);
              continue;
            }

            if (!line.trim()) {
              flushPara(para);
              i++;
              continue;
            }

            para.push(line.trim());
            i++;
          }
          flushPara(para);
          // footnotes section
          if (Object.keys(footnotes).length) {
            out.push(
              '<hr><section class="footnotes"><ol>' +
                Object.entries(footnotes)
                  .map(
                    ([k, v]) =>
                      `<li id="fn-${k}"><a href="#fnref-${k}" class="footnote-backref">↩</a> ${inline(v, ctx)}</li>`,
                  )
                  .join("") +
                '</ol></section>',
            );
          }

          
          return {html: out.join("\n"), headings};
        }

        function buildList(items, start, ctx) {
          const level = items[start].indent;
          const ordered = items[start].ordered;
          const parts = [];
          let isTasks = false;
          let i = start;
          while (i < items.length && items[i].indent >= level) {
            if (items[i].indent > level) {
              const sub = buildList(items, i, ctx);
              parts[parts.length - 1] = parts[parts.length - 1].replace(
                /<\/li>$/,
                sub.html + "</li>",
              );
              i = sub.next;
              continue;
            }
            let t = items[i].text;
            const task = t.match(/^\[([ xX])\]\s+(.*)$/);
            if (task) {
              isTasks = true;
              const done = task[1].toLowerCase() === "x";
              parts.push(
                `<li class="${done ? "done" : ""}"><input type="checkbox" disabled ${done ? "checked" : ""}><span>${inline(task[2], ctx)}</span></li>`,
              );
            } else {
              parts.push(`<li>${inline(t, ctx)}</li>`);
            }
            i++;
          }
          const tag = ordered ? "ol" : "ul";
          return {
            html: `<${tag}${isTasks ? ' class="tasks"' : ""}>${parts.join("")}</${tag}>`,
            next: i,
          };
        }

        /* strip markdown for previews / search */
        function plain(src) {
          return src
            .replace(/```[\s\S]*?```/g, " ")
            .replace(/^\s*>\s?\[![^\]]+\]\s*/gm, "")
            .replace(/^\s*>\s?/gm, "")
            .replace(/^#{1,6}\s+/gm, "")
            .replace(/^\s*\|.*\|\s*$/gm, " ")
            .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, a, b) => b || a)
            .replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1")
            .replace(/<\/?[a-z][^>]*>/gi, "")
            .replace(/[*_~`$>#]/g, "")
            .replace(/\s+/g, " ")
            .trim();
        }

        function renderMath(root) {
          if (!window.katex) return;
          root.querySelectorAll("[data-tex]").forEach((el) => {
            try {
              window.katex.render(el.dataset.tex, el, {
                displayMode: el.dataset.display === "1",
                throwOnError: false,
              });
            } catch (e) {
              /* keep the raw source visible */
            }
          });
        }

        return {parse, inline, plain, slugify, renderMath, esc};
      })();

        function applyUnfinished(container, headingText) {
          // Find the heading that starts the unfinished section
          const h2s = container.querySelectorAll("h2");

            if (h2.textContent.trim().startsWith(headingText)) {
