# 阶段 2：正式对外。80 只留 ACME，其余 301 到 https；www 也 301 到裸域。
# 证书由 certbot 签发在 /etc/letsencrypt/live/eregion.cn/。
# 注意 nginx 1.18 用 `listen 443 ssl http2;`（1.25.1+ 才支持 `http2 on;`）。

# ---------- 80：续期挑战 + 跳 https ----------
server {
    listen 80;
    server_name eregion.cn www.eregion.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://eregion.cn$request_uri; }
}

# ---------- www -> 裸域 ----------
server {
    listen 443 ssl http2;
    server_name www.eregion.cn;

    ssl_certificate     /etc/letsencrypt/live/eregion.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eregion.cn/privkey.pem;

    return 301 https://eregion.cn$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl http2;
    server_name eregion.cn;

    root /srv/study-vault;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/eregion.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eregion.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 512;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Cache-Control "no-store" always;

    location / { try_files $uri $uri/ =404; }
    location ~* \.(ttf|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    # 静态资源长缓存（2026-10-24）：vendor/fonts/图片强缓存，数据文件回源校验
    location ^~ /vendor/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~* \.(png|jpe?g|svg|webp|ico|gif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /favicon.ico {
        return 302 /favicon.svg;
    }
    location = /feed.xml {
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /search-index.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /vault-index.json {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ^~ /vault-notes/ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # deny source files: 构建脚本 / 说明文档 / 原始 markdown 不对外（2026-10-24）
    location ~* \.(py|md|sh|conf|yml|yaml|toml)$ {
        deny all;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /ops/ {
        deny all;
    }
    location ^~ /content/ {
        deny all;
        add_header Cache-Control "no-store" always;
    }
    location ~ /\. { deny all; }

    error_page 404 /404.html;

    location = /vault.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location = /404.html { internal; }
}
