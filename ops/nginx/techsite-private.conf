# 私网入口：只监听 10.1.4.2，VPC 内可达；公网打不到（防火墙只放 22/80/22000）
# 用途：让老机的隐藏路径把它反代出去，供备案前自己预览（带 Basic Auth）
server {
    listen 10.1.4.2:8080;
    server_name _;

    root /srv/study-vault;
    index index.html;
    charset utf-8;

    auth_basic "techsite preview";
    auth_basic_user_file /etc/nginx/.htpasswd-techsite;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 512;

    location / { try_files $uri $uri/ =404; }
    location ~* \.(ttf|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location ~ /\. { deny all; }

    error_page 404 /404.html;

    location = /vault.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location = /404.html { internal; }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
}
