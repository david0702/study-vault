<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>404 · 这页不在笔记里</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D97757'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23FAF9F5' stroke-width='2.5'/%3E%3Cpath d='M10 10 L22 22 M22 10 L10 22' stroke='%23FAF9F5' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      @font-face {
        font-family: "Sarasa Gothic J";
        src: url("/fonts/Sarasa_Gothic_J.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Sarasa Gothic J";
        src: url("/fonts/Sarasa_Gothic_J_Semibold.woff2") format("woff2");
        font-weight: 600;
        font-display: swap;
      }
      :root {
        --bg: #f0e8d0;
        --card: #fdfaf4;
        --ink: #2d2318;
        --muted: #7a6b58;
        --line: #e0d5bd;
        --accent: #c7653c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #594636;
          --card: #423326;
          --ink: #efe4d4;
          --muted: #a6947e;
          --line: #6b5a46;
          --accent: #e89464;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.75 "Sarasa Gothic J", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 560px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 40px 36px;
        box-shadow: 0 10px 30px rgba(45, 35, 24, 0.08);
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 999px;
        padding: 6px 10px;
      }
      h1 { margin: 18px 0 10px; font-size: 28px; line-height: 1.35; }
      p { margin: 0 0 10px; color: var(--muted); }
      code {
        font-family: ui-monospace, Consolas, monospace;
        background: rgba(199, 101, 60, 0.1);
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 13px;
        word-break: break-all;
      }
      .actions { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      a.btn {
        display: inline-block;
        text-decoration: none;
        color: #fdfaf4;
        background: var(--accent);
        padding: 10px 18px;
        border-radius: 10px;
        font-weight: 600;
      }
      a.link { color: var(--muted); text-decoration: none; border-bottom: 1px dashed var(--line); padding-bottom: 2px; }
      footer { margin-top: 22px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">404 NOT FOUND</span>
      <h1>这页不在笔记里</h1>
      <p>地址可能敲错了，或者对应的笔记被改名、删除了。</p>
      <p id="path"></p>
      <div class="actions">
        <a class="btn" href="/">回到首页</a>
        <a class="link" href="/#/n/welcome">看看「欢迎」那篇</a>
      </div>
      <footer>个人技术笔记 · eregion.cn</footer>
    </main>
    <script>
      var p = document.getElementById("path");
      if (p && location.pathname !== "/") {
        p.innerHTML = "请求路径：<code></code>";
        p.querySelector("code").textContent = location.pathname;
      }
    </script>
  </body>
</html>
